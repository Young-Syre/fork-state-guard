# A real, runnable manifest against Ethereum mainnet USDC.
#
#   fork-state-guard check examples/usdc-proxy.toml --rpc https://eth.drpc.org
#
# It is not a vulnerability report -- it is a live demonstration of the
# checks, against a contract anyone can read. USDC is a useful example for
# one specific reason: its proxy predates EIP-1967 and keeps the
# implementation in the OpenZeppelin legacy slot, so `standard = "auto"` has
# to probe more than one standard to find it. A tool that only knew EIP-1967
# would report "not a proxy" here and quietly tell you nothing.

[meta]
chain_id = 1
label = "USDC proxy and token parameters (example)"
notes = "Read-only demonstration manifest; the values below were read from mainnet."

[[proxy]]
name = "usdc proxy"
address = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
standard = "auto"
implementation = "0x43506849D7C04F9138D1A2050bbF3A0c054402dd"
admin = "0x807a96288A1A408dBC13DE2b1d087d10356395d2"
note = "FiatTokenProxy; implementation lives in the pre-1967 zeppelinos slot"

[[param]]
name = "usdc.owner"
address = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
call = "owner()"
expect = "0xFcb19e6a322b27c06842A71e8c725399f049AE3a"

[[param]]
name = "usdc.paused"
address = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
call = "paused()"
expect = false
note = "a paused token is not an exploitable token"

[[param]]
name = "usdc.decimals"
address = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
call = "decimals()"
returns = "uint256"
expect = 6
note = "decimals drive every amount in a PoC; 6 is not 18"

[[param]]
name = "usdc.symbol"
address = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
call = "symbol()"
returns = "string"
expect = "USDC"

[[param]]
name = "usdc.totalSupply"
address = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
call = "totalSupply()"
returns = "uint256"
expect_gte = "1000000000000000"
allow_drift = "supply moves with every mint and burn; only the floor matters here"
note = "an explicitly waived assumption -- the report prints this justification"
